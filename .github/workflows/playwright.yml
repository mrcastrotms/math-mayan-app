name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyMockKeyForTestingPurposesOnly12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mayan-math-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "project-487993138099"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mayan-math-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"

      - name: Start Next.js Server in Background
        run: npm run start &
        env:
          PORT: 3000
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyMockKeyForTestingPurposesOnly12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mayan-math-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "project-487993138099"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mayan-math-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"

      - name: Wait for Server to be Ready
        run: |
          node -e '
          const http = require("http");
          const checkServer = () => {
            http.get("http://localhost:3000", (res) => {
              if (res.statusCode === 200) {
                console.log("Server is ready!");
                process.exit(0);
              } else {
                setTimeout(checkServer, 1000);
              }
            }).on("error", () => {
              setTimeout(checkServer, 1000);
            });
          };
          checkServer();
          '

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PORT: 3000
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyMockKeyForTestingPurposesOnly12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mayan-math-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "project-487993138099"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mayan-math-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
