name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyMockKeyForTestingPurposesOnly12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mayan-math-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "project-487993138099"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mayan-math-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PORT: 3000
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyMockKeyForTestingPurposesOnly12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mayan-math-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "project-487993138099"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mayan-math-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
