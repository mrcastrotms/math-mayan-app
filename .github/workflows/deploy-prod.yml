name: Verify Production

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  verify:
    name: Verify production candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run lint, build, unit, and E2E tests
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyFakeKeyForCiTesting1234567890"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "math-mayan-app.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "math-mayan-app"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "math-mayan-app.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:abcdef123456"
        run: |
          npm run lint -- --quiet
          npm run build
          npm run test:unit
          npx playwright test --project=chromium

  production-soak:
    name: Production soak
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Hold for required soak
        run: |
          echo "All production checks passed. Holding for the required 10-minute soak."
          sleep 600
          echo "Soak complete. Deployment is handled by the protected production integration."
